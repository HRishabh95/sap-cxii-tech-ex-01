[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/product_similarity"]

[project]
name = "sap-cxii-tech-ex-01"
version = "0.1.0"
description = "Product similarity search for Amazon Fashion dataset"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pandas>=2.2.2",
    "numpy>=1.26.4",
    "scikit-learn>=1.4.2",
    "sentence-transformers>=2.7.0",
    "faiss-cpu>=1.8.0",
    "torchvision>=0.17.2",
    "requests>=2.32.5",
    "gensim>=4.4.0",
]

[tool.uv]
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "sys_platform == 'linux'",
]
